name: Pages

# Serves the web page at the address in .nsite/config.json from GitHub Pages. The files are those of the signed site
# manifest (kind 35128) on the relays, each checked against its sha256 as it is downloaded from a Blossom server by
# stepstr's mirror (stepstr/pipeline/mirror-nostr.ts). Nothing is built here, so the page is byte for byte the nsite.
# On the schedule it deploys only when the manifest's index.html differs from the one served; started by hand it always
# deploys. No secrets are needed: the manifest and the files are public.
on:
  schedule:
    - cron: '22,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-24.04
    outputs:
      deploy: ${{ steps.mirror.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      # stepstr's tools with stepstr's packages, and no install scripts: nothing from the dependency tree runs here.
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: stepstr
      - id: mirror
        working-directory: stepstr
        env:
          STEPSTR_SITE: ..
          UNLESS_SERVED: ${{ github.event_name == 'schedule' && '--unless-served' || '' }}
        run: |
          npx tsx pipeline/mirror-nostr.ts ../site $UNLESS_SERVED
          if [ -f ../site/index.html ]; then echo deploy=true; else echo deploy=false; fi >> "$GITHUB_OUTPUT"
      - if: steps.mirror.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  # Runs no project code and installs nothing; the only job that may write to Pages.
  deploy:
    needs: mirror
    if: needs.mirror.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
