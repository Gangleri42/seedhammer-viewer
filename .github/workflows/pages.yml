name: Build and deploy

# Rebuilds on changes here, when sh-hardware reports a new model (repository_dispatch), when the board repository
# (seedhammer/hardware) moves past what the site was built from (checked every 10 minutes), daily as a fallback, and
# by hand.
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [hardware-updated]
  schedule:
    - cron: '17 4 * * *'
    - cron: '4-59/10 * * * *'
  workflow_dispatch:

# Read-only for every job; only the deploy job, which runs no project code or dependencies, may write to Pages.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The 10-minute schedule builds only when a tracked board changed since the live site was built. Every other
  # trigger builds.
  watch:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            pipeline/boards.json
            scripts/boards-changed.mjs
            static/CNAME
          sparse-checkout-cone-mode: false
      - id: check
        env:
          SCHEDULE: ${{ github.event.schedule }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$SCHEDULE" = '4-59/10 * * * *' ]; then node scripts/boards-changed.mjs >> "$GITHUB_OUTPUT"
          else echo changed=true >> "$GITHUB_OUTPUT"; fi

  # Nothing is built or deployed from a tree or history that carries private data. The report names rules and
  # places, never the match; PRIVATE_TERMS is an optional secret with one private term per line.
  privacy:
    needs: watch
    if: needs.watch.outputs.build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/privacy-check.mjs --tree HEAD --history HEAD
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}

  build:
    needs: privacy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check out the hardware repository with its full history
        uses: actions/checkout@v7
        with:
          repository: Gangleri42/sh-hardware
          path: sh-hardware
          fetch-depth: 0
      - name: Check out the board repository with its full history and every branch
        uses: actions/checkout@v7
        with:
          repository: seedhammer/hardware
          path: seedhammer-hardware
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install cadquery-ocp==8.0.1.0.0
      # A pipeline change still restores the last cache: its board exports (.cache/boards) outlive the pipeline hash.
      - name: Restore converted models and board exports
        uses: actions/cache@v6
        with:
          path: |
            .cache/models
            .cache/boards
          key: models-${{ hashFiles('pipeline/**', 'export/**') }}-${{ github.run_id }}
          restore-keys: |
            models-${{ hashFiles('pipeline/**', 'export/**') }}-
            models-
      - run: npm ci
      - run: npm test
      # kicad-cli runs from KiCad's image, pinned by digest in the script, and only for board revisions not cached.
      - name: Convert every model version and board revision
        run: npm run models
        env:
          HARDWARE_DIR: sh-hardware
          CONVERT: python
          UPSTREAM_DIR: seedhammer-hardware
          BOARDS: required
          KICAD_CLI: scripts/kicad-docker.sh
          KICAD_VERSION: '10.0.6'
          KICAD_3DMODELS: /usr/share/kicad/3dmodels
      - run: npm run build
      # The napplet is checked here but published only from a machine with the signer (npm run publish:nostr).
      - run: npm run build:napplet
      # Every test before anything is uploaded, so a failure never leaves a second Pages artifact behind for a re-run.
      - run: npm test
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build
      - uses: actions/upload-artifact@v7
        with:
          name: napplet
          path: dist-napplet

  # The NAP conformance suite needs a browser download, which can stall; it runs beside the deploy, not before it.
  conformance:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: napplet
          path: dist-napplet
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 10
      - run: npm run test:conformance

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
